<!doctype html>
<html lang="en">
<head>

  <title>Karry-No-Key · Laptop Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --pink: #EE5A93; --pink-dark: #B8336A; --ink: #2A1F2D; --soft: #FFF3F8; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--soft); color: var(--ink); display: flex; justify-content: center; padding: 32px 16px; }
    main { width: 100%; max-width: 440px; text-align: center; }
    h1 { margin: 0 0 8px; }
    h1 img { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; }
    .sub { margin: 0 0 28px; font-size: 18px; color: #5E4D62; }
    button#rec { width: 180px; height: 180px; border-radius: 50%; border: none; background: var(--pink);
                 color: #fff; font-family: inherit; font-size: 22px; font-weight: 700; cursor: pointer;
                 box-shadow: 0 10px 30px rgba(238,90,147,.4); }
    button#rec:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 4px; }
    button#rec:disabled { opacity: .5; cursor: default; }
    button#rec.recording { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    #status { margin: 20px 0; min-height: 1.4em; font-weight: 600; }
    .card { background: #fff; border-radius: 14px; padding: 14px 16px; margin: 10px 0; text-align: left;
            box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    .card.top { border: 2px solid var(--pink); }
    .title { font-weight: 700; font-size: 18px; }
    .meta { opacity: .7; font-size: 14px; margin-top: 2px; }
    .card a { color: var(--pink-dark); font-weight: 600; font-size: 14px; }
    .card .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    .card button.save { border: none; border-radius: 999px; background: var(--pink); color: #fff;
                        font-family: inherit; font-weight: 700; font-size: 15px; padding: 10px 16px; min-height: 44px; cursor: pointer; }
    .card button.save:disabled { opacity: .6; cursor: default; }
    .card button.save:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 2px; }
    .saved-note { margin: 8px 0 0; font-weight: 600; color: var(--pink-dark); }
  </style>
  <!-- PostHog analytics (project key is public by design; secrets stay in .env) -->

        api_host: 'https://us.i.posthog.com',

</head>
<body>
<main>
  <h1><img src="/karry-no-key-logo-pink.svg" alt="Karry-No-Key" width="662" height="213" /></h1>
  <p class="sub">Sing or hum about 12 seconds of the song stuck in your head.</p>
  <button id="rec">Tap to sing</button>
  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
  const RECORD_SECONDS = 12;
  const TARGET_RATE = 16000; // smaller file, still plenty for voice
  const QUIET_THRESHOLD = 0.01; // below this, the recording is treated as silence

  const btn = document.getElementById("rec");
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");

  // Small helper so the app still works if PostHog is blocked (e.g. by an ad blocker).
  function track(event, props) {
    if (window.posthog) posthog.capture(event, props || {});
  }

  btn.addEventListener("click", async () => {
    track("tapped_sing");
    resultsEl.innerHTML = "";
    // Create the audio engine straight away, while the tap still counts: phones (especially
    // iPhones) only allow sound recording to start directly from a tap.
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      ctx.close();
      statusEl.textContent = "Microphone blocked. Allow microphone access for this page in your browser settings and try again.";
      return;
    }
    if (ctx.state === "suspended") await ctx.resume();

    // Capture raw audio samples from the mic.
    const source = ctx.createMediaStreamSource(stream);
    const processor = ctx.createScriptProcessor(4096, 1, 1);
    const chunks = [];
    processor.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
    source.connect(processor);
    processor.connect(ctx.destination);

    btn.disabled = true;
    btn.classList.add("recording");
    for (let s = RECORD_SECONDS; s > 0; s--) {
      btn.textContent = s + "…";
      statusEl.textContent = "Recording — keep singing!";
      await new Promise((r) => setTimeout(r, 1000));
    }

    processor.disconnect();
    source.disconnect();
    stream.getTracks().forEach((t) => t.stop());
    const samples = flatten(chunks);
    const wav = encodeWav(downsample(samples, ctx.sampleRate, TARGET_RATE), TARGET_RATE);
    ctx.close();

    // If the recording is almost silent, don't send it to ACRCloud: tell the singer instead.
    if (loudness(samples) < QUIET_THRESHOLD) {
      btn.classList.remove("recording");
      btn.disabled = false;
      btn.textContent = "Sing again";
      statusEl.textContent = "I couldn't hear you! Sing a bit louder and closer to the microphone, and check no other app is using it.";
      track("too_quiet", { loudness: loudness(samples) });
      return;
    }

    btn.classList.remove("recording");
    btn.textContent = "Listening…";
    statusEl.textContent = "Asking ACRCloud what song that was…";

    try {
      const resp = await fetch("/identify", { method: "POST", headers: { "Content-Type": "audio/wav" }, body: wav });
      const data = await resp.json();
      showResults(data);
    } catch (e) {
      statusEl.textContent = "Couldn't reach Karry-No-Key. Check your internet connection and try again.";
    }
    btn.disabled = false;
    btn.textContent = "Sing again";
  });

  function showResults(data) {
    if (!data.matches || data.matches.length === 0) {
      statusEl.textContent = data.message || "No match found.";
      track("no_match", { message: data.message || "" });
      return;
    }
    track("song_matched", {
      top_title: data.matches[0].title,
      top_artist: data.matches[0].artist,
      top_score: data.matches[0].score,
      match_count: data.matches.length,
    });
    statusEl.textContent = "Is it one of these?";
    data.matches.forEach((m, i) => {
      const card = document.createElement("div");
      card.className = "card" + (i === 0 ? " top" : "");
      const title = document.createElement("div");
      title.className = "title";
      title.textContent = (i === 0 ? "⭐ " : "") + m.title;
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = m.artist + (m.score != null ? " · match score " + m.score : "");
      card.append(title, meta);
      const actions = document.createElement("div");
      actions.className = "actions";
      if (m.save_ticket) {
        const save = document.createElement("button");
        save.type = "button";
        save.className = "save";
        save.textContent = "Add to playlist";
        save.addEventListener("click", () => saveSong(m, i, save, card));
        actions.append(save);
      }
      if (m.spotify_url) {
        const a = document.createElement("a");
        a.href = m.spotify_url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "Open in Spotify →";
        a.addEventListener("click", () => track("clicked_spotify", { title: m.title, artist: m.artist, rank: i + 1 }));
        actions.append(a);
      }
      card.append(actions);
      resultsEl.append(card);
    });
  }

  // "Add to playlist": the server saves it to the shared Sung It playlist on Spotify.
  async function saveSong(m, rank, button, card) {
    document.querySelectorAll("button.save").forEach((b) => (b.disabled = true));
    button.textContent = "Saving…";
    let data = { ok: false, message: "Couldn't reach Karry-No-Key. Try again." };
    try {
      const resp = await fetch("/save", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ ticket: m.save_ticket }) });
      data = await resp.json();
    } catch (e) {}
    const note = document.createElement("p");
    note.className = "saved-note";
    note.textContent = data.message;
    if (data.ok) {
      button.textContent = "Saved ✓";
      track("saved_to_spotify", { title: m.title, artist: m.artist, rank: rank + 1 });
      if (data.playlist_url) {
        const link = document.createElement("a");
        link.href = data.playlist_url; link.target = "_blank"; link.rel = "noopener";
        link.textContent = " See the playlist →";
        note.append(link);
      }
    } else {
      button.textContent = "Add to playlist";
      document.querySelectorAll("button.save").forEach((b) => (b.disabled = false));
      track("save_failed", { title: m.title, message: data.message || "" });
    }
    card.append(note);
  }

  // Average volume of the recording (0 = silence, 1 = as loud as possible).
  function loudness(samples) {
    let sum = 0;
    for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
    return samples.length ? Math.sqrt(sum / samples.length) : 0;
  }

  function flatten(chunks) {
    const out = new Float32Array(chunks.reduce((n, c) => n + c.length, 0));
    let i = 0;
    for (const c of chunks) { out.set(c, i); i += c.length; }
    return out;
  }

  function downsample(samples, fromRate, toRate) {
    if (toRate >= fromRate) return samples;
    const ratio = fromRate / toRate;
    const out = new Float32Array(Math.floor(samples.length / ratio));
    for (let i = 0; i < out.length; i++) {
      const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
      let sum = 0;
      for (let j = start; j < end; j++) sum += samples[j];
      out[i] = sum / (end - start);
    }
    return out;
  }

  // Package the samples as a standard 16-bit mono .wav file.
  function encodeWav(samples, rate) {
    const buf = new ArrayBuffer(44 + samples.length * 2);
    const v = new DataView(buf);
    const str = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, samples.length * 2, true);
    for (let i = 0; i < samples.length; i++) {
      const s = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
    }
    return new Blob([buf], { type: "audio/wav" });
  }
</script>
</body>
</html>
