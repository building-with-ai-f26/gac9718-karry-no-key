  <style>
    :root { --pink: #EE5A93; --pink-dark: #B8336A; --ink: #2A1F2D; --soft: #FFF3F8; --green: #1F8A5B; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--soft); color: var(--ink); display: flex; justify-content: center; padding: 24px 16px; }
    main { width: 100%; max-width: 440px; text-align: center; }
    .logo { display: block; width: 100%; max-width: 220px; height: auto; margin: 0 auto 4px; }
    h1 { margin: 8px 0 6px; font-size: 32px; color: var(--pink-dark); }
    .sub { margin: 0 0 24px; font-size: 17px; color: #5E4D62; }
    .big { border: none; border-radius: 999px; background: var(--pink); color: #fff; font-family: inherit;
           font-weight: 700; font-size: 20px; padding: 16px 36px; min-height: 56px; cursor: pointer;
           box-shadow: 0 8px 24px rgba(238,90,147,.35); }
    .big:disabled { opacity: .5; cursor: default; }
    .ghost { display: inline-block; margin-top: 14px; color: var(--pink-dark); font-weight: 600; text-decoration: none;
             font-size: 16px; padding: 10px; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 3px; }
    .progress { font-weight: 600; color: #5E4D62; margin-bottom: 10px; }
    .song { font-size: 15px; color: #5E4D62; margin-bottom: 14px; }
    .line { background: #fff; border-radius: 16px; padding: 22px 18px; font-size: 22px; line-height: 1.45;
            font-weight: 600; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 18px; min-height: 96px; }
    .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--pink); color: var(--pink-dark); }
    .choices { display: grid; gap: 10px; }
    .choice { border: 2px solid var(--pink); background: #fff; color: var(--ink); border-radius: 14px;
              font-family: inherit; font-size: 19px; font-weight: 600; padding: 14px; min-height: 52px; cursor: pointer; }
    .choice.right { background: var(--green); border-color: var(--green); color: #fff; }
    .choice.wrong { background: #fff; border-color: #C9B8C6; color: #8A7A88; text-decoration: line-through; }
    .choice:disabled { cursor: default; }
    #feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 700; font-size: 19px; }
    #feedback.good { color: var(--green); }
    #feedback.bad { color: var(--pink-dark); }
    .score { font-size: 64px; font-weight: 700; color: var(--pink); margin: 6px 0 0; }
    .verdict { font-size: 24px; font-weight: 700; margin: 4px 0 20px; }
    #status { margin-top: 18px; font-weight: 600; min-height: 1.4em; }
    [hidden] { display: none !important; }
  </style>
