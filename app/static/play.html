  <style>
    :root { --pink: #EE5A93; --pink-dark: #B8336A; --ink: #2A1F2D; --soft: #FFF3F8; --green: #1F8A5B; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Fredoka", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: var(--soft); color: var(--ink); display: flex; justify-content: center; padding: 24px 16px; }
    main { width: 100%; max-width: 440px; text-align: center; }
    .logo { display: block; width: 100%; max-width: 220px; height: auto; margin: 0 auto 4px; }
    h1 { margin: 8px 0 6px; font-size: 32px; color: var(--pink-dark); }
    .sub { margin: 0 0 24px; font-size: 17px; color: #5E4D62; }
    .big { border: none; border-radius: 999px; background: var(--pink); color: #fff; font-family: inherit;
           font-weight: 700; font-size: 20px; padding: 16px 36px; min-height: 56px; cursor: pointer;
           box-shadow: 0 8px 24px rgba(238,90,147,.35); }
    .big:disabled { opacity: .5; cursor: default; }
    .ghost { display: inline-block; margin-top: 14px; color: var(--pink-dark); font-weight: 600; text-decoration: none;
             font-size: 16px; padding: 10px; }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--pink-dark); outline-offset: 3px; }
    .progress { font-weight: 600; color: #5E4D62; margin-bottom: 10px; }
    .song { font-size: 15px; color: #5E4D62; margin-bottom: 14px; }
    .line { background: #fff; border-radius: 16px; padding: 22px 18px; font-size: 22px; line-height: 1.45;
            font-weight: 600; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 18px; min-height: 96px; }
    .gap { display: inline-block; min-width: 3.2em; border-bottom: 3px solid var(--pink); color: var(--pink-dark); }
    .choices { display: grid; gap: 10px; }
    .choice { border: 2px solid var(--pink); background: #fff; color: var(--ink); border-radius: 14px;
              font-family: inherit; font-size: 19px; font-weight: 600; padding: 14px; min-height: 52px; cursor: pointer; }
    .choice.right { background: var(--green); border-color: var(--green); color: #fff; }
    .choice.wrong { background: #fff; border-color: #C9B8C6; color: #8A7A88; text-decoration: line-through; }
    .choice:disabled { cursor: default; }
    #feedback { min-height: 1.6em; margin: 16px 0 0; font-weight: 700; font-size: 19px; }
    #feedback.good { color: var(--green); }
    #feedback.bad { color: var(--pink-dark); }
    .score { font-size: 64px; font-weight: 700; color: var(--pink); margin: 6px 0 0; }
    .verdict { font-size: 24px; font-weight: 700; margin: 4px 0 20px; }
    .earned { margin: -10px 0 20px; font-size: 19px; font-weight: 700; color: var(--pink-dark); }
    #status { margin-top: 18px; font-weight: 600; min-height: 1.4em; }
    [hidden] { display: none !important; }
  </style>

<body>
<main>
  <a href="/"><img class="logo" src="/karry-no-key-logo-pink.svg" alt="Karry-No-Key home" width="662" height="213" /></a>

  <section id="start">
    <h1>Finish the Lyric</h1>
    <p class="sub">Five lines from songs in your Sung It playlist. Tap the missing word!</p>
    <button class="big" id="play">Play</button>
    <div id="status" role="status"></div>
    <a class="ghost" href="/">← Back to Tap to sing</a>
  </section>

  <section id="round" hidden>
    <div class="progress" id="progress"></div>
    <div class="song" id="song"></div>
    <div class="line" id="line" aria-live="polite"></div>
    <div class="choices" id="choices"></div>
    <p id="feedback" role="status"></p>
  </section>

  <section id="end" hidden>
    <h1>You scored</h1>
    <p class="score" id="final"></p>
    <p class="verdict" id="verdict"></p>
    <p class="earned" id="earned"></p>
    <button class="big" id="again">Play again</button><br />
    <a class="ghost" href="/">← Back to Tap to sing</a>
  </section>
</main>

<script>
  const ROUNDS = 5;
  const $ = (id) => document.getElementById(id);
  let roundNo = 0, score = 0, seen = new Set(), upcoming = null;

  // Karry Points from games are kept on this device (shown on the home page with your song points).
  const POINTS_PER_LYRIC = 10, PERFECT_BONUS = 50;
  let earned = 0;
  function addPoints(n) {
    earned += n;
    try {
      const now = parseInt(localStorage.getItem("knk-game-points") || "0", 10) || 0;
      localStorage.setItem("knk-game-points", String(now + n));
    } catch (e) {}
  }

  function track(event, props) {
    if (window.posthog) posthog.capture(event, props || {});
  }

  // Ask the server for a round, skipping lines we've already played this game.
  async function fetchRound() {
    for (let tries = 0; tries < 4; tries++) {
      const resp = await fetch("/game/round", { cache: "no-store" });
      const data = await resp.json();
      if (!data.ok) return data;
      const key = data.before + "|" + data.answer + "|" + data.after;
      if (!seen.has(key) || tries === 3) { seen.add(key); return data; }
    }
  }

  function show(id) {
    for (const s of ["start", "round", "end"]) $(s).hidden = s !== id;
  }

  // Lyrics come from outside, so they're always inserted as plain text, never as HTML.
  function drawLine(r, filled) {
    const line = $("line");
    line.textContent = "";
    if (r.before) line.append(r.before + " ");
    const gap = document.createElement("span");
    gap.className = "gap";
    gap.textContent = filled || "\u00a0";
    line.append(gap);
    if (r.after) line.append((/^[,.!?;:]/.test(r.after) ? "" : " ") + r.after);
  }

  async function startGame() {
    $("play").disabled = true;
    $("status").textContent = "Finding your songs…";
    roundNo = 0; score = 0; seen = new Set(); earned = 0;
    try {
      upcoming = await fetchRound();
    } catch (e) {
      upcoming = { ok: false, message: "Couldn't reach Karry-No-Key. Check your connection and try again." };
    }
    $("play").disabled = false;
    if (!upcoming || !upcoming.ok) {
      $("status").textContent = (upcoming && upcoming.message) || "Something went wrong. Try again.";
      show("start");
      return;
    }
    $("status").textContent = "";
    track("game_started");
    nextRound();
  }

  function nextRound() {
    const r = upcoming;
    upcoming = null;
    if (!r || !r.ok) { endGame(); return; }
    roundNo++;
    show("round");
    $("progress").textContent = "Round " + roundNo + " of " + ROUNDS + " · Score " + score;
    $("song").textContent = r.title + " · " + r.artist;
    $("feedback").textContent = "";
    $("feedback").className = "";
    drawLine(r);
    const box = $("choices");
    box.textContent = "";
    for (const word of r.choices) {
      const b = document.createElement("button");
      b.className = "choice";
      b.textContent = word;
      b.addEventListener("click", () => answer(r, word, b));
      box.append(b);
    }
    box.querySelector("button").focus();
    // Get the next round ready while they think.
    if (roundNo < ROUNDS) fetchRound().then((d) => { upcoming = d; }).catch(() => { upcoming = null; });
  }

  function answer(r, word, button) {
    const right = word.toLowerCase() === r.answer.toLowerCase();
    if (right) { score++; addPoints(POINTS_PER_LYRIC); }
    for (const b of $("choices").querySelectorAll("button")) {
      b.disabled = true;
      if (b.textContent.toLowerCase() === r.answer.toLowerCase()) b.classList.add("right");
      else if (b === button) b.classList.add("wrong");
    }
    drawLine(r, r.answer);
    $("feedback").textContent = right ? "Correct! +" + POINTS_PER_LYRIC + " Karry Points" : "Not quite. It was \u201c" + r.answer + "\u201d";
    $("feedback").className = right ? "good" : "bad";
    $("progress").textContent = "Round " + roundNo + " of " + ROUNDS + " · Score " + score;
    track("game_answered", { correct: right, round: roundNo, title: r.title, artist: r.artist });
    setTimeout(async () => {
      if (roundNo >= ROUNDS) { endGame(); return; }
      // If the next round is still loading, wait for it (up to ~10 seconds).
      for (let i = 0; i < 20 && upcoming === null; i++) await new Promise((ok) => setTimeout(ok, 500));
      nextRound();
    }, 2200);
  }

  function endGame() {
    show("end");
    $("final").textContent = score + " / " + roundNo;
    $("verdict").textContent = score === roundNo && roundNo > 0 ? "Lyric legend! 🎤"
      : score >= Math.ceil(roundNo * 0.6) ? "So close! Nearly a legend." : "Keep singing! 🎶";
    if (score === roundNo && roundNo > 0) addPoints(PERFECT_BONUS);
    $("earned").textContent = earned > 0
      ? "+" + earned + " Karry Points" + (score === roundNo && roundNo > 0 ? " (including a " + PERFECT_BONUS + "-point perfect bonus!)" : "")
      : "No points this time. Have another go!";
    track("game_finished", { score: score, rounds: roundNo, points: earned });
    $("again").focus();
  }

  $("play").addEventListener("click", startGame);
  $("again").addEventListener("click", startGame);
</script>
</body>
</html>
